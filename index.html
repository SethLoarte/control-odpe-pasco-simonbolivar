<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta ONPE - Simón Bolívar</title>
    <style>
        :root {
            --azul-onpe: #003366;
            --celeste-onpe: #4a90e2;
            --rojo-onpe: #e30613;
            --gris-fondo: #f4f6f9;
            --blanco: #ffffff;
            --texto-oscuro: #333333;
            --texto-claro: #666666;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: var(--gris-fondo); color: var(--texto-oscuro); }
        .hidden { display: none !important; }
        
        /* --- VISTA INICIO --- */
        #login-view { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; 
            background-image: url('https://consultaelectoral.onpe.gob.pe/assets/img/fondos/fondo03.svg'); background-size: cover; background-position: center;
        }
        .login-card { background: var(--blanco); padding: 40px 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); max-width: 400px; width: 100%; text-align: center; }
        .login-card h2 { color: var(--azul-onpe); font-size: 20px; margin-bottom: 5px; }
        .login-card h3 { color: var(--rojo-onpe); font-size: 16px; margin-top: 0; margin-bottom: 25px; }
        .input-group input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; text-align: center; }
        .btn-consultar { width: 100%; background-color: #757575; color: var(--blanco); border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        
        /* --- VISTA RESULTADOS --- */
        .navbar { background: var(--blanco); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-salir { color: var(--azul-onpe); background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .dashboard-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        /* --- ESTILO ONPE DASHBOARD (NUEVO) --- */
        .onpe-dashboard { background: transparent; margin-bottom: 40px; }
        
        /* Fila Superior (Top Cards) */
        .top-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .top-card { background: var(--blanco); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 15px; }
        .top-card.cargo-card { background: var(--rojo-onpe); color: var(--blanco); justify-content: center; text-align: center; flex-direction: column; padding: 15px; gap: 5px;}
        .top-card.cargo-card h4 { margin: 0; font-size: 22px; font-weight: bold; text-transform: uppercase; }
        .top-card.cargo-card span { font-size: 14px; }
        .icon-circle { width: 45px; height: 45px; background: #eef2f7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--azul-onpe); flex-shrink: 0;}
        .card-data p { margin: 0; font-size: 12px; color: var(--celeste-onpe); font-weight: bold; }
        .card-data h4 { margin: 3px 0 0 0; font-size: 15px; color: var(--azul-onpe); text-transform: uppercase; }

        /* Fila Inferior (Middle Section) */
        .middle-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .middle-section { grid-template-columns: 1fr; } }
        
        .main-card { background: var(--blanco); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .main-card-title { color: var(--celeste-onpe); font-size: 16px; margin: 0 0 15px 0; font-weight: normal; }
        
        /* Bloque Local Votación */
        .local-box { display: flex; gap: 15px; align-items: stretch; flex-wrap: wrap;}
        .ie-box { background: var(--celeste-onpe); color: var(--blanco); border-radius: 8px; padding: 15px; flex: 2; min-width: 200px; display: flex; align-items: center; gap: 10px; }
        .ie-box .map-icon { font-size: 30px; border-right: 1px solid rgba(255,255,255,0.3); padding-right: 10px; }
        .mesa-box { background: #f4f6f9; border-radius: 8px; padding: 15px; flex: 1; text-align: center; min-width: 100px;}
        .mesa-box span { color: var(--texto-claro); font-size: 12px; }
        .mesa-box h4 { color: var(--celeste-onpe); font-size: 20px; margin: 5px 0 0 0; }

        /* Formulario Capacitación */
        .form-area { background: #fcfcfc; border: 1px solid #eee; border-radius: 8px; padding: 15px; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px; background: #ffebee; color: var(--rojo-onpe); }
        .form-area select, .form-area input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        .btn-guardar { background: var(--azul-onpe); color: var(--blanco); border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-guardar:hover { background: #002244; }
    </style>
</head>
<body>

    <div id="login-view">
        <div class="login-card">
            <img src="https://consultaelectoral.onpe.gob.pe/assets/logos/logo-eleccion.svg" style="height: 60px; margin-bottom: 15px;">
            <h2>Elecciones Regionales</h2>
            <h3>Distrito Simón Bolívar</h3>
            
            <div class="input-group">
                <input type="number" id="inputBusqueda" placeholder="DNI (8) o N° Mesa (6)" onkeypress="if(event.key === 'Enter') consultar()">
            </div>
            <button class="btn-consultar" onclick="consultar()" id="btnConsultarPrincipal">CONSULTAR</button>
            <p id="mensaje-login" style="font-size: 14px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <div class="navbar">
            <img src="https://consultaelectoral.onpe.gob.pe/assets/logos/logo-eleccion.svg" alt="ONPE" style="height: 40px;">
            <button class="btn-salir" onclick="cerrarSesion()">Salir ➔</button>
        </div>
        <div class="dashboard-container" id="contenedor-resultados">
            <!-- Interfaz inyectada vía JS -->
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHpxLnBr2_P1IYZ1aFxhGD5wUWdEZUQviUrTRM27BS5aUYfUSu5Y7pZl0fRXWxrcSO3A/exec';
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShFcVD-MAHCeuCCteYy-mrnAU7VT9XWMQitmvFt_ZW8F2qssKpCI7upzfr_pJ2hoBZk-5gH4U9BaF-/pub?gid=1997588352&single=true&output=csv';

        async function consultar() {
            const valor = document.getElementById('inputBusqueda').value.trim();
            const msj = document.getElementById('mensaje-login');
            const btn = document.getElementById('btnConsultarPrincipal');
            
            if(valor.length !== 8 && valor.length !== 6) {
                msj.style.color = 'red';
                msj.innerText = "Ingrese un DNI (8 dígitos) o Mesa (6 dígitos).";
                return;
            }

            const esDni = valor.length === 8;
            msj.style.color = '#333';
            msj.innerText = 'Consultando base de datos...';
            btn.disabled = true;

            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const filas = text.split('\n');
                
                let htmlTarjetas = '';
                let encontrados = 0;

                for(let i = 1; i < filas.length; i++) {
                    const col = filas[i].split(',');
                    if(col.length > 8) {
                        const mesaStr = col[0].trim();
                        const dniStr = col[1].trim();
                        
                        if ((esDni && dniStr === valor) || (!esDni && mesaStr === valor)) {
                            encontrados++;
                            
                            // Estado de capacitación visual
                            let estadoActual = col[8] ? col[8].trim() : '';
                            let badgeHtml = estadoActual 
                                ? `<div class="status-badge" style="background:#e8f5e9; color:#2e7d32;">Registrado: ${estadoActual}</div>` 
                                : `<div class="status-badge">Sin registrar</div>`;

                            // Inyección HTML del Nuevo Diseño ONPE
                            htmlTarjetas += `
                            <div class="onpe-dashboard">
                                
                                <div class="top-cards">
                                    <div class="top-card cargo-card">
                                        <span>MIEMBRO DE MESA</span>
                                        <h4>${col[4]}</h4>
                                    </div>
                                    <div class="top-card">
                                        <div class="icon-circle">👤</div>
                                        <div class="card-data">
                                            <p>DNI: ${col[1]}</p>
                                            <h4>${col[2]} ${col[3]}</h4>
                                        </div>
                                    </div>
                                    <div class="top-card">
                                        <div class="icon-circle">📍</div>
                                        <div class="card-data">
                                            <p>Domicilio / Contacto</p>
                                            <h4 style="font-size:13px; text-transform:none;">${col[6] || 'No especificado'}<br>📱 Cel: ${col[5] || 'Sin número'}</h4>
                                        </div>
                                    </div>
                                </div>

                                <div class="middle-section">
                                    
                                    <div class="main-card">
                                        <h3 class="main-card-title">Capacitación (Gestión Interna)</h3>
                                        <div class="form-area">
                                            ${badgeHtml}
                                            <div style="font-size:12px; color:#666; margin-bottom:10px;">Obs. actuales: ${col[9] || 'Ninguna'}</div>
                                            
                                            <select id="cap_${col[1]}">
                                                <option value="">Actualizar estado a...</option>
                                                <option value="1ra Jornada">1ra Jornada</option>
                                                <option value="2da Jornada">2da Jornada</option>
                                                <option value="Personalizada - Local">Personalizada - Local</option>
                                                <option value="Personalizada - Domicilio">Personalizada - Domicilio</option>
                                                <option value="Virtual">Virtual</option>
                                                <option value="No Capacitado">No Capacitado</option>
                                            </select>
                                            <input type="text" id="obs_${col[1]}" placeholder="Añadir observación nueva...">
                                            <button class="btn-guardar" id="btn_${col[1]}" onclick="guardar('${col[1]}')">Actualizar Datos</button>
                                            <p id="msg_${col[1]}" style="text-align:center; font-size:12px; font-weight:bold; margin-top:8px;"></p>
                                        </div>
                                    </div>

                                    <div class="main-card">
                                        <h3 class="main-card-title">Tu local de votación</h3>
                                        <div class="local-box">
                                            <div class="ie-box">
                                                <div class="map-icon">🗺️</div>
                                                <div>
                                                    <strong style="font-size:14px;">${col[7]}</strong><br>
                                                    <span style="font-size:12px; opacity:0.9;">Distrito Simón Bolívar</span>
                                                </div>
                                            </div>
                                            <div class="mesa-box">
                                                <span>● N° de Mesa:</span>
                                                <h4>${col[0]}</h4>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            <hr style="border: 0; border-top: 2px dashed #ddd; margin: 30px 0;">
                            `;
                        }
                    }
                }
                
                if(encontrados > 0) {
                    document.getElementById('contenedor-resultados').innerHTML = htmlTarjetas;
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    document.getElementById('inputBusqueda').value = '';
                    msj.innerText = '';
                } else {
                    msj.style.color = 'red';
                    msj.innerText = "No se encontraron resultados.";
                }
            } catch(e) {
                msj.style.color = 'red';
                msj.innerText = "Error conectando con la base de datos.";
            } finally {
                btn.disabled = false;
            }
        }

        function guardar(dniTarget) {
            const cap = document.getElementById('cap_' + dniTarget).value;
            const obs = document.getElementById('obs_' + dniTarget).value;
            const msj = document.getElementById('msg_' + dniTarget);
            const btn = document.getElementById('btn_' + dniTarget);
            
            msj.style.color = 'var(--azul-onpe)';
            msj.innerText = 'Guardando...';
            btn.disabled = true;

            const urlEnvio = `${SCRIPT_URL}?dni=${dniTarget}&cap=${encodeURIComponent(cap)}&obs=${encodeURIComponent(obs)}`;

            fetch(urlEnvio, { mode: 'no-cors' })
            .then(() => {
                msj.style.color = '#2e7d32';
                msj.innerText = '¡Actualizado con éxito!';
            }).catch(() => {
                msj.style.color = 'red';
                msj.innerText = 'Error al guardar.';
            }).finally(() => {
                btn.disabled = false;
                setTimeout(() => { msj.innerText = ''; }, 3000);
            });
        }

        function cerrarSesion() {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('contenedor-resultados').innerHTML = '';
        }
    </script>
</body>
</html>
